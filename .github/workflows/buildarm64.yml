name: Build Clint Browser ARM64 Test APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper JAR
        id: cache-wrapper-jar
        uses: actions/cache@v5
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-jar-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Provision Gradle Wrapper JAR
        if: steps.cache-wrapper-jar.outputs.cache-hit != 'true'
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\\.[0-9]+(\\.[0-9]+)?(?=-bin\\.zip)' gradle/wrapper/gradle-wrapper.properties)
          cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          curl -fL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist
          "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: printf '%s\\n' "${{ secrets.LOCAL_PROPERTIES }}" > local.properties

      # Debug variants are automatically signed with Android's debug key.
      # The .debug application ID suffix allows this test build to coexist
      # with the regular Clint Browser installation.
      - name: Build signed GitHub debug APK
        run: ./gradlew assembleGithubDebug

      - name: List and verify generated APKs
        run: |
          find app/build/outputs/apk/github/debug -type f -name "*.apk" -print | sort
          test -n "$(find app/build/outputs/apk/github/debug -type f -name "*.apk" -print -quit)"

      - name: Upload installable test APKs
        uses: actions/upload-artifact@v7
        with:
          name: Clint-GitHub-debug-test-apks
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
